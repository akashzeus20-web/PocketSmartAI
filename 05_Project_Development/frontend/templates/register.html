{% extends "base.html" %}

{% block title %}Create an Account — PocketSmart AI{% endblock %}

{% block content %}
<div class="container" style="padding: 60px 20px 80px; max-width: 480px;">
    <div class="card">
        <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 8px; text-align: center;">Join PocketSmart AI</h2>
        <p style="color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; text-align: center;">Start planning smarter purchases within your budget.</p>

        <form id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Choose a username (min 3 chars)" minlength="3" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create a password (min 6 chars)" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Create Account</button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--muted);">
            Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600;">Log in here</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("register-form");
    if (!form) return;

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
            const res = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, email, password })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.detail || "Registration failed.");
            }

            PocketApp.showToast("Account created successfully! Please log in.", "success");
            setTimeout(() => {
                window.location.href = "/login";
            }, 1000);
        } catch (err) {
            PocketApp.showToast(err.message, "error");
        }
    });
});
</script>
{% endblock %}
